[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alladin"
version = "0.7.0"
requires-python = ">=3.11"
description = "Headless Coinbase instrument research and paper trading backend."
dependencies = []

[project.optional-dependencies]
engine = ["nautilus_trader==1.231.0"]

[project.scripts]
alladin = "alladin.__main__:main"

[tool.setuptools.packages.find]
include = ["alladin*"]

[tool.setuptools.package-data]
alladin = ["finance_prompts/*.md", "finance_prompts/catalog.json", "finance_prompts/roles/*.md", "finance_prompts/skills/*.md"]
