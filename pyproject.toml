[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alladin"
version = "0.5.0"
requires-python = ">=3.11"
description = "Paper research backend. Broad market vision; Coinbase is the only execution venue."
dependencies = []

[project.scripts]
alladin = "alladin.__main__:main"

[tool.setuptools.packages.find]
include = ["alladin*"]
