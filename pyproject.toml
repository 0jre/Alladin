[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alladin"
version = "0.6.0"
requires-python = ">=3.11"
description = "Solana-only spot paper trading research backend with read-only market data."
dependencies = []

[project.scripts]
alladin = "alladin.__main__:main"

[tool.setuptools.packages.find]
include = ["alladin*"]

[tool.setuptools.package-data]
alladin = ["finance_prompts/*.md", "finance_prompts/catalog.json", "finance_prompts/roles/*.md", "finance_prompts/skills/*.md"]
